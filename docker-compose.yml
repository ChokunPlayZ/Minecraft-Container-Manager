services:
  mcm:
    build:
      context: .
      args:
        MCM_BUILD_COMMIT: ${MCM_BUILD_COMMIT:-unknown}
        MCM_BUILD_DIRTY: ${MCM_BUILD_DIRTY:-false}
    container_name: mcm
    ports:
      - "8080:8080"
    environment:
      MCM_ADDR: ${MCM_ADDR:-:8080}
      MCM_PORT_RANGE: ${MCM_PORT_RANGE:-25565-25665}
      # Container-side data path the panel reads/writes itself. /data is the
      # fixed mount point defined by the bind mount below.
      MCM_DATA_DIR: /data
      MCM_BACKUP_DIR: ${MCM_BACKUP_DIR:-/data/backups}
      # Host-side path that the bind mount maps onto /data. Docker resolves the
      # bind source for each server container against the HOST, not the panel
      # container, so MCM needs this host path to mount a server's data dir.
      # Defaults to ${PWD}/data (the project directory). Override to place data
      # elsewhere by setting MCM_DATA_DIR_HOST to an absolute host path.
      MCM_DATA_DIR_HOST: ${MCM_DATA_DIR_HOST:-${PWD}/data}
      MCM_DB_PATH: ${MCM_DB_PATH:-/data/mcm.db}
      DOCKER_HOST: ${DOCKER_HOST:-unix:///var/run/docker.sock}
      MCM_CONTAINER_RUNTIME: ${MCM_CONTAINER_RUNTIME:-docker}
      MCM_CONTAINER_HOST: ${MCM_CONTAINER_HOST:-}
      MCM_SERVER_IMAGE: ${MCM_SERVER_IMAGE:-eclipse-temurin:21-jre-alpine}
      MCM_S3_ENDPOINT: ${MCM_S3_ENDPOINT:-}
      MCM_S3_ACCESS_KEY: ${MCM_S3_ACCESS_KEY:-}
      MCM_S3_SECRET_KEY: ${MCM_S3_SECRET_KEY:-}
      MCM_S3_BUCKET: ${MCM_S3_BUCKET:-}
      MCM_S3_REGION: ${MCM_S3_REGION:-us-east-1}
      MCM_LOGIN_MAX_ATTEMPTS: ${MCM_LOGIN_MAX_ATTEMPTS:-5}
      MCM_LOGIN_LOCKOUT: ${MCM_LOGIN_LOCKOUT:-15m}
      MCM_RATE_LIMIT_MAX: ${MCM_RATE_LIMIT_MAX:-100}
      MCM_RATE_LIMIT_WINDOW: ${MCM_RATE_LIMIT_WINDOW:-1m}
      MCM_DEFAULT_CPU_LIMIT: ${MCM_DEFAULT_CPU_LIMIT:-0}
      MCM_DEFAULT_MEMORY_MB: ${MCM_DEFAULT_MEMORY_MB:-0}
      MCM_TRUSTED_PROXIES: ${MCM_TRUSTED_PROXIES:-}
      MCM_WEB_AUTHN_RP_NAME: ${MCM_WEB_AUTHN_RP_NAME:-Minecraft Container Manager}
      MCM_HTTP_ONLY: ${MCM_HTTP_ONLY:-false}
      MCM_TLS: ${MCM_TLS:-false}
      MCM_TLS_CERT: ${MCM_TLS_CERT:-}
      MCM_TLS_KEY: ${MCM_TLS_KEY:-}
      MCM_TLS_REDIRECT: ${MCM_TLS_REDIRECT:-false}
      MCM_WEB_AUTHN_RPID: ${MCM_WEB_AUTHN_RPID:-localhost}
      MCM_WEB_AUTHN_RP_ORIGIN: ${MCM_WEB_AUTHN_RP_ORIGIN:-}
      # UID/GID the MCM process drops to (and that own the data dir). Override
      # to match your host user, e.g. PUID=$(id -u) PGID=$(id -g).
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      CURSEFORGE_API_KEY: ${CURSEFORGE_API_KEY:-}
    volumes:
      # Host bind mount. Must match MCM_DATA_DIR_HOST above so the path the
      # panel sees (/data) and the host path MCM binds for server containers
      # refer to the same directory.
      - ${MCM_DATA_DIR_HOST:-${PWD}/data}:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
