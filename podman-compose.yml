# Standalone Podman deployment: podman compose -f podman-compose.yml up -d --build
# Start the API first: systemctl --user enable --now podman.socket
services:
  mcm:
    build:
      context: .
      args:
        MCM_BUILD_COMMIT: ${MCM_BUILD_COMMIT:-unknown}
        MCM_BUILD_DIRTY: ${MCM_BUILD_DIRTY:-false}
    container_name: mcm
    ports:
      - "8080:8080"
    environment:
      MCM_ADDR: ${MCM_ADDR:-:8080}
      MCM_PORT_RANGE: ${MCM_PORT_RANGE:-25565-25665}
      MCM_DATA_DIR: /data
      MCM_BACKUP_DIR: ${MCM_BACKUP_DIR:-/data/backups}
      # Keep interpolation flat for compatibility with podman-compose 1.5.
      MCM_DATA_DIR_HOST: ${MCM_DATA_DIR_HOST:?Set MCM_DATA_DIR_HOST to an absolute host data directory}
      MCM_DB_PATH: ${MCM_DB_PATH:-/data/mcm.db}
      MCM_CONTAINER_RUNTIME: podman
      MCM_CONTAINER_HOST: unix:///run/podman/podman.sock
      MCM_SERVER_IMAGE: ${MCM_SERVER_IMAGE:-eclipse-temurin:21-jre-alpine}
      MCM_S3_ENDPOINT: ${MCM_S3_ENDPOINT:-}
      MCM_S3_ACCESS_KEY: ${MCM_S3_ACCESS_KEY:-}
      MCM_S3_SECRET_KEY: ${MCM_S3_SECRET_KEY:-}
      MCM_S3_BUCKET: ${MCM_S3_BUCKET:-}
      MCM_S3_REGION: ${MCM_S3_REGION:-us-east-1}
      MCM_LOGIN_MAX_ATTEMPTS: ${MCM_LOGIN_MAX_ATTEMPTS:-5}
      MCM_LOGIN_LOCKOUT: ${MCM_LOGIN_LOCKOUT:-15m}
      MCM_RATE_LIMIT_MAX: ${MCM_RATE_LIMIT_MAX:-100}
      MCM_RATE_LIMIT_WINDOW: ${MCM_RATE_LIMIT_WINDOW:-1m}
      MCM_DEFAULT_CPU_LIMIT: ${MCM_DEFAULT_CPU_LIMIT:-0}
      MCM_DEFAULT_MEMORY_MB: ${MCM_DEFAULT_MEMORY_MB:-0}
      MCM_TRUSTED_PROXIES: ${MCM_TRUSTED_PROXIES:-}
      MCM_WEB_AUTHN_RP_NAME: ${MCM_WEB_AUTHN_RP_NAME:-Minecraft Container Manager}
      MCM_HTTP_ONLY: ${MCM_HTTP_ONLY:-false}
      MCM_TLS: ${MCM_TLS:-false}
      MCM_TLS_CERT: ${MCM_TLS_CERT:-}
      MCM_TLS_KEY: ${MCM_TLS_KEY:-}
      MCM_TLS_REDIRECT: ${MCM_TLS_REDIRECT:-false}
      MCM_WEB_AUTHN_RPID: ${MCM_WEB_AUTHN_RPID:-localhost}
      MCM_WEB_AUTHN_RP_ORIGIN: ${MCM_WEB_AUTHN_RP_ORIGIN:-}
      # Root inside rootless containers maps to the host user. Keep both the
      # panel and its sibling servers in that mapping, including socket access.
      PUID: 0
      PGID: 0
      TZ: ${TZ:-UTC}
      CURSEFORGE_API_KEY: ${CURSEFORGE_API_KEY:-}
    security_opt:
      - label=disable
    volumes:
      # Shared SELinux label allows the sibling servers to use this data too.
      - type: bind
        source: ${MCM_DATA_DIR_HOST:?Set MCM_DATA_DIR_HOST to an absolute host data directory}
        target: /data
        bind:
          selinux: z
      # This is a filesystem path, without the unix:// API endpoint prefix.
      # Rootless hosts must set MCM_PODMAN_SOCKET to their user's socket path.
      - type: bind
        source: ${MCM_PODMAN_SOCKET:-/run/podman/podman.sock}
        target: /run/podman/podman.sock
        bind:
          create_host_path: false
    restart: unless-stopped
